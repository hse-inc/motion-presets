<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ln-marker 見本</title>
<link rel="stylesheet" href="preset.css">
<style>
  /* 見本用の枠（プリセットの一部ではない） */
  html, body { margin: 0; height: 100%; font-family: system-ui, "Hiragino Sans", sans-serif; color: #1a1a2e; }
  body { background: #fff7e0; }
  .stage { height: 100%; display: grid; place-items: center; }
  .card { width: 270px; padding: 18px 20px; background: #fff; border: 3px solid #1a1a2e; border-radius: 14px; box-shadow: 4px 5px 0 #1a1a2e; font-size: 17px; font-weight: 700; line-height: 1.8; }
</style>
</head>
<body>
<div class="stage"><p class="card pf-ln-marker" data-demo style="margin:0;--pf-delay:200ms"><span class="pf-ln" style="--c:0">車がなくても、</span><span class="pf-ln" style="--c:1">バスで島を一周できる。</span><span class="pf-ln" style="--c:2">足の心配は、いらない。</span></p></div>
<script>
/* 見本の再生制御（撮影ツール tools/shoot_preview.mjs が使う）
 *   通常: .is-on を付けて 3.0 秒見せ、0.4 秒外してループ再生
 *   ?manual を付けると自動再生しない。撮影ツールが demoReset() → demoPlay() を呼ぶ */
(function () {
  var targets = document.querySelectorAll('[data-demo]');
  window.demoReset = function () { targets.forEach(function (t) { t.classList.remove('is-on'); }); };
  window.demoPlay = function () { targets.forEach(function (t) { t.classList.add('is-on'); }); };
  if (/[?&]manual\b/.test(location.search)) return;
  // 見せる時間を長く・空白は 0.4 秒だけ（空のカードが壊れて見えないように）
  function loop() { window.demoPlay(); setTimeout(function () { window.demoReset(); setTimeout(loop, 400); }, 3000); }
  setTimeout(loop, 300);
})();
</script>
</body>
</html>
