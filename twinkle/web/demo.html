<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>twinkle 見本</title>
<link rel="stylesheet" href="preset.css">
<style>
  /* 見本用の枠（プリセットの一部ではない） */
  html, body { margin: 0; height: 100%; font-family: system-ui, "Hiragino Sans", sans-serif; color: #1a1a2e; }
  body { background: #1b1830; }
  .stage { position: relative; height: 100%; }
  .pf-twinkle { position: absolute; left: var(--x); top: var(--y); }
</style>
</head>
<body>
<div class="stage"><span class="pf-twinkle" data-demo style="--x:18%;--y:30%;--pf-size:26px;--pf-delay:0s;--pf-color:#ffd24d"></span><span class="pf-twinkle" data-demo style="--x:70%;--y:18%;--pf-size:16px;--pf-delay:0.5s;--pf-color:#fff"></span><span class="pf-twinkle" data-demo style="--x:44%;--y:56%;--pf-size:34px;--pf-delay:1.1s;--pf-color:#ffd24d"></span><span class="pf-twinkle" data-demo style="--x:82%;--y:62%;--pf-size:20px;--pf-delay:0.3s;--pf-color:#9fd8ff"></span><span class="pf-twinkle" data-demo style="--x:28%;--y:76%;--pf-size:14px;--pf-delay:1.5s;--pf-color:#fff"></span><span class="pf-twinkle" data-demo style="--x:60%;--y:82%;--pf-size:22px;--pf-delay:0.8s;--pf-color:#ffb4d6"></span><span class="pf-twinkle" data-demo style="--x:10%;--y:58%;--pf-size:12px;--pf-delay:1.8s;--pf-color:#fff"></span></div>
<script>
/* 見本の再生制御（撮影ツール tools/shoot_preview.mjs が使う）
 *   通常: .is-on を付けたまま動かし続ける（常に動く動きのため）
 *   ?manual を付けると自動再生しない。撮影ツールが demoReset() → demoPlay() を呼ぶ */
(function () {
  var targets = document.querySelectorAll('[data-demo]');
  window.demoReset = function () { targets.forEach(function (t) { t.classList.remove('is-on'); }); };
  window.demoPlay = function () { targets.forEach(function (t) { t.classList.add('is-on'); }); };
  if (/[?&]manual\b/.test(location.search)) return;
  // 見せる時間を長く・空白は 0.4 秒だけ（空のカードが壊れて見えないように）
  setTimeout(window.demoPlay, 300);
})();
</script>
</body>
</html>
