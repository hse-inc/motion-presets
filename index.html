function sync() {
  buildFilters.rows.forEach(function (r) {
    r[1].chips.forEach(function (c, i) { c.setAttribute('aria-pressed', String(i === 0 ? state[r[0]] === null : state[r[0]] === c.textContent)); });
  });
  var shown = 0, secs = { a: 0, b: 0 };
  PRESETS.forEach(function (p, i) {
    var ok = (!state.genre || p.genres.indexOf(state.genre) >= 0) && (!state.texture || p.textures.indexOf(state.texture) >= 0);
    document.getElementById('card-' + i).hidden = !ok; if (ok) { shown++; secs[p.sample ? 'b' : 'a']++; }
  });
  document.getElementById('sec-a').hidden = secs.a === 0;
  document.getElementById('sec-b').hidden = secs.b === 0;
  document.getElementById('empty').hidden = shown > 0;
}
function splitSet(v) { return String(v || '').split(/\s+/).filter(Boolean); }
function fld(p) { return state.f[p.name] || (state.f[p.name] = { project: '', page: '', set: '' }); }
function shq(v) { return '"' + String(v).replace(/(["\\$`])/g, '\\$1') + '"'; }
// 指示文（AI に貼る）
function lineFor(p) {
  var f = fld(p), w = state.where[p.name] || '', sets = splitSet(f.set);
  var s = '動きプリセット「' + p.name + '」を' + (f.project ? '案件 ' + f.project + ' の' : '案件の') + (f.page ? ' ' + f.page + ' に' : 'ページに') + '適用してください。';
  s += '適用箇所: ' + w + '。';
  if (sets.length) s += 'パラメータ: ' + sets.join(' ') + '。';
  s += '（animations/' + p.name + '/PRESET.md と web/ を読んで再現。記録と CSS の取り込みは tools/apply_preset.sh）';
  return s;
}
// コマンド（手元で実行する）
function cmdFor(p) {
  var f = fld(p), w = state.where[p.name] || '', sets = splitSet(f.set);
  var c = 'bash tools/apply_preset.sh ' + (f.project || '<project>') + ' ' + (f.page || '<page>') + ' ' + p.name;
  c += ' --at ' + shq(w || '適用箇所');
  if (sets.length) c += ' --set ' + sets.join(' ');
  return c;
}
function pickedText(fn) { return PRESETS.filter(function (p) { return state.selected[p.name]; }).map(fn).join('\n'); }
function updateBar() {
  var n = PRESETS.filter(function (p) { return state.selected[p.name]; }).length;
  document.getElementById('count').textContent = n + ' 件選択中';
  document.getElementById('copy').disabled = n === 0;
  document.getElementById('copycmd').disabled = n === 0;
  document.getElementById('fallback').style.display = 'none';
}
function showView(view, p, mode) {
  view.textContent = '';
  if (mode === 'capture') { var im = el('img'); im.src = p.name + '/' + p.capture; im.alt = p.name + ' 実サイトでの使用例'; view.appendChild(im); return; }
  if (!p.demo) { if (p.preview) { var g = el('img'); g.src = p.name + '/' + p.preview; view.appendChild(g); } return; }
  var f = el('iframe'); f.title = p.name + ' 見本'; f.loading = 'lazy'; f.setAttribute('scrolling', 'no');
  var loaded = false;
  f.onload = function () { loaded = true; };
  f.src = p.name + '/web/demo.html';
  view.appendChild(f);
  // iframe が使えない環境では 3 秒たっても読み込みが完了しないので、preview.gif に差し替える
  setTimeout(function () { if (!loaded && p.preview) { view.textContent = ''; var g2 = el('img'); g2.src = p.name + '/' + p.preview; g2.alt = p.name + ' 見本'; view.appendChild(g2); } }, 3000);
}
function buildCards() {
  PRESETS.forEach(function (p, i) {
    var grid = document.getElementById(p.sample ? 'grid-b' : 'grid-a');
    var c = el('article', 'card'); c.id = 'card-' + i;
    var view = el('div', 'view');
    if (p.capture) {
      var tabs = el('div', 'tabs'), t1 = el('button', 'tab', '見本'), t2 = el('button', 'tab', '実サイト');
      t1.setAttribute('aria-pressed', 'true'); t2.setAttribute('aria-pressed', 'false');
      t1.onclick = function () { t1.setAttribute('aria-pressed', 'true'); t2.setAttribute('aria-pressed', 'false'); showView(view, p, 'demo'); };
      t2.onclick = function () { t2.setAttribute('aria-pressed', 'true'); t1.setAttribute('aria-pressed', 'false'); showView(view, p, 'capture'); };
      tabs.appendChild(t1); tabs.appendChild(t2); c.appendChild(tabs);
    }
    c.appendChild(view);
    var b = el('div', 'body');
    b.appendChild(el('h2', null, p.name));
    b.appendChild(el('p', 'desc', p.desc));
    var tags = el('div', 'tags');
    p.genres.forEach(function (t) { tags.appendChild(el('span', 'tag g', t)); });
    p.textures.forEach(function (t) { tags.appendChild(el('span', 'tag', t)); });
    b.appendChild(tags);
    b.appendChild(el('p', 'src', p.sample ? '事例なし' : '使用: ' + p.source));
    var lab = el('label', 'pick'), cb = el('input'); cb.type = 'checkbox';
    cb.onchange = function () { state.selected[p.name] = cb.checked; c.classList.toggle('sel', cb.checked); updateBar(); };
    lab.appendChild(cb); lab.appendChild(document.createTextNode('選ぶ')); b.appendChild(lab);
    var host = el('div', 'apply'); b.appendChild(host); applyHosts.push([p, host]);
    c.appendChild(b); grid.appendChild(c);
    // 画面に入ったものから見本を動かす（file:// でも動く）
    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function (es) { if (es[0].isIntersecting) { io.disconnect(); showView(view, p, 'demo'); } }, { rootMargin: '200px' });
      io.observe(c);
    } else showView(view, p, 'demo');
  });
}
function copyText(text, okMsg) {
  var fb = document.getElementById('fallback'), note = document.getElementById('count');
  function fallback() { fb.value = text; fb.style.display = 'block'; fb.focus(); fb.select(); note.textContent = '自動でコピーできないため、下の文を選んでコピーしてください'; }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { fb.style.display = 'none'; note.textContent = '✓ ' + okMsg; }, fallback);
  } else fallback();
}
document.getElementById('copy').onclick = function () { var t = pickedText(lineFor); copyText(t, 'コピーしました（指示文 ' + t.split('\n').length + ' 件）'); };
document.getElementById('copycmd').onclick = function () { var t = pickedText(cmdFor); copyText(t, 'コピーしました（コマンド ' + t.split('\n').length + ' 件）'); };

function labeled(text, input) { var l = el('label', 'f', text); l.appendChild(input); return l; }
function textInput(ph, val, fn, label) { var i = el('input'); i.type = 'text'; i.placeholder = ph; i.value = val || ''; i.setAttribute('aria-label', label); i.oninput = function () { fn(i.value); }; return i; }
function renderPublic(p, host) {
  var f = fld(p);
  host.appendChild(el('p', 'mode', '公開モード：案件名・ページ・適用箇所を書いて、文をコピーして使います'));
  var r = el('div', 'row2');
  r.appendChild(labeled('案件名', textInput('案件のフォルダ名', f.project, function (v) { f.project = v; }, p.name + ' の案件名')));
  r.appendChild(labeled('ページ', textInput('p1・p2 …', f.page, function (v) { f.page = v; }, p.name + ' のページ')));
  host.appendChild(r);
  host.appendChild(labeled('適用箇所', textInput('例: p2 の見出し', state.where[p.name], function (v) { state.where[p.name] = v; }, p.name + ' の適用箇所')));
  host.appendChild(labeled('パラメータ（任意）', textInput('例: --pf-dur=0.5s --pf-delay=0.1s', f.set, function (v) { f.set = v; }, p.name + ' のパラメータ')));
  var bt = el('div', 'btns'), b1 = el('button', null, '指示文をコピー'), b2 = el('button', null, 'コマンドをコピー');
  b1.onclick = function () { copyText(lineFor(p), '指示文をコピーしました'); };
  b2.onclick = function () { copyText(cmdFor(p), 'コマンドをコピーしました'); };
  bt.appendChild(b1); bt.appendChild(b2); host.appendChild(bt);
}
function renderLocal(p, host) {
  var f = fld(p);
  host.appendChild(el('p', 'mode', 'ローカルモード：まず確認（dry-run）→ 内容を見てから反映'));
  var selP = el('select'), selG = el('select');
  selP.setAttribute('aria-label', p.name + ' の案件'); selG.setAttribute('aria-label', p.name + ' のページ');
  function fillPages() {
    selG.textContent = '';
    var pr = PROJECTS.filter(function (x) { return x.name === selP.value; })[0];
    var pages = pr ? pr.pages : [];
    if (!pages.length) { var o = el('option', null, pr && !pr.hasMotionColumn ? '（DNA.md に動き列なし）' : '（ページなし）'); o.value = ''; selG.appendChild(o); }
    pages.forEach(function (g) { var o = el('option', null, g); o.value = g; selG.appendChild(o); });
    f.page = selG.value;
  }
  var o0 = el('option', null, '案件を選ぶ'); o0.value = ''; selP.appendChild(o0);
  PROJECTS.forEach(function (x) { var o = el('option', null, x.name); o.value = x.name; selP.appendChild(o); });
  selP.value = f.project || ''; fillPages(); if (f.page) selG.value = f.page; f.page = selG.value;
  var out = el('pre'); out.hidden = true;
  var bGo = el('button', 'go', 'この内容で反映'); bGo.hidden = true;
  var bDry = el('button', null, '反映');
  function reset() { out.hidden = true; bGo.hidden = true; out.className = ''; }
  selP.onchange = function () { f.project = selP.value; fillPages(); reset(); };
  selG.onchange = function () { f.page = selG.value; reset(); };
  var r = el('div', 'row2');
  r.appendChild(labeled('案件', selP)); r.appendChild(labeled('ページ', selG));
  host.appendChild(r);
  host.appendChild(labeled('適用箇所', textInput('例: p2 の見出し', state.where[p.name], function (v) { state.where[p.name] = v; reset(); }, p.name + ' の適用箇所')));
  host.appendChild(labeled('パラメータ（任意）', textInput('例: --pf-dur=0.5s', f.set, function (v) { f.set = v; reset(); }, p.name + ' のパラメータ')));
  function run(dry) {
    if (!selP.value || !selG.value) { out.hidden = false; out.className = 'ng'; out.textContent = '案件とページを選んでください'; return; }
    out.hidden = false; out.className = ''; out.textContent = dry ? '確認中…' : '反映中…'; bDry.disabled = bGo.disabled = true;
    fetch('api/apply', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ project: selP.value, page: selG.value, name: p.name, at: state.where[p.name] || '', set: splitSet(f.set), dryRun: dry }) })
      .then(function (res) { return res.json().then(function (j) { return { status: res.status, j: j }; }); })
      .then(function (x) {
        var ok = x.status === 200 && x.j.ok;
        out.className = ok ? '' : 'ng';
        out.textContent = x.j.output || x.j.error || ('失敗しました（' + x.status + '）');
        bGo.hidden = !(ok && dry);
        if (ok && !dry) out.textContent = '【反映しました】\n' + out.textContent;
      })
      .catch(function () { out.className = 'ng'; out.textContent = 'サーバーに届きませんでした'; })
      .then(function () { bDry.disabled = bGo.disabled = false; });
  }
  bDry.onclick = function () { run(true); }; bGo.onclick = function () { run(false); };
  var bt = el('div', 'btns'); bt.appendChild(bDry); bt.appendChild(bGo); host.appendChild(bt); host.appendChild(out);
}
function renderApplies() {
  applyHosts.forEach(function (h) { h[1].textContent = ''; (MODE === 'local' ? renderLocal : renderPublic)(h[0], h[1]); });
  var bd = document.getElementById('modebadge');
  bd.textContent = MODE === 'local' ? 'ローカルモード' : '公開モード'; bd.className = MODE === 'local' ? 'badge local' : 'badge';
  document.getElementById('lead').textContent = MODE === 'local'
    ? '手元の案件に反映できます。案件・ページ・適用箇所を選び、「反映」で内容を確かめてから「この内容で反映」を押します。'
    : '動きを選び、カードの欄に案件名・ページ・適用箇所を書いて、指示文かコマンドをコピーできます。';
}
function detectMode() {
  if (!/^https?:$/.test(location.protocol) || !window.fetch) return Promise.resolve(false);
  return fetch('api/projects', { cache: 'no-store' }).then(function (r) {
    if (!r.ok || (r.headers.get('content-type') || '').indexOf('application/json') < 0) throw new Error('no api');
    return r.json();
  }).then(function (j) {
    if (!j || j.ok !== true || !Array.isArray(j.projects)) throw new Error('bad');
    PROJECTS = j.projects; return true;
  }).catch(function () { return false; });
}
buildFilters(); buildCards(); sync(); updateBar(); renderApplies();
detectMode().then(function (local) { if (local) { MODE = 'local'; renderApplies(); } });
</script>
