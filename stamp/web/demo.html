<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stamp 見本</title>
<link rel="stylesheet" href="preset.css">
<style>
  /* 見本用の枠（プリセットの一部ではない） */
  html, body { margin: 0; height: 100%; font-family: system-ui, "Hiragino Sans", sans-serif; color: #1a1a2e; }
  body { background: #fff7e0; }
  .stage { height: 100%; display: grid; place-items: center; }
  .seal { display: inline-block; padding: 8px 22px; border: 5px solid #d63a2f; border-radius: 10px; color: #d63a2f; font-size: 40px; font-weight: 900; letter-spacing: 0.08em; background: rgb(255 255 255 / 0.6); }
</style>
</head>
<body>
<div class="stage"><div class="seal pf-stamp" data-demo style="--pf-delay: 150ms">採用決定</div></div>
<script>
/* 見本の再生制御（撮影ツール tools/shoot_preview.mjs が使う）
 *   通常: .is-on を付けて 2.2 秒見せ、0.4 秒外してループ再生
 *   ?manual を付けると自動再生しない。撮影ツールが demoReset() → demoPlay() を呼ぶ */
(function () {
  var targets = document.querySelectorAll('[data-demo]');
  window.demoReset = function () { targets.forEach(function (t) { t.classList.remove('is-on'); }); };
  window.demoPlay = function () { targets.forEach(function (t) { t.classList.add('is-on'); }); };
  if (/[?&]manual\b/.test(location.search)) return;
  // 見せる時間を長く・空白は 0.4 秒だけ（空のカードが壊れて見えないように）
  function loop() { window.demoPlay(); setTimeout(function () { window.demoReset(); setTimeout(loop, 400); }, 2200); }
  setTimeout(loop, 300);
})();
</script>
</body>
</html>
