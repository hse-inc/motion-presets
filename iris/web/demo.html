<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iris 見本</title>
<link rel="stylesheet" href="preset.css">
<style>
  /* 見本用の枠（プリセットの一部ではない） */
  html, body { margin: 0; height: 100%; font-family: system-ui, "Hiragino Sans", sans-serif; color: #1a1a2e; }
  body { background: #1b2430; }
  .stage { height: 100%; display: grid; place-items: center; }
  .frame { position: relative; width: 340px; height: 220px; overflow: hidden; border-radius: 12px; }
  .ph { position: absolute; inset: 0; display: grid; place-items: center; font-size: 28px; font-weight: 900; color: #fff; letter-spacing: 0.1em; }
  .ph--a { background: linear-gradient(135deg, #2f7fd0, #8ec5f5); }
  .ph--b { background: linear-gradient(135deg, #e0457b, #ffb36b); }
</style>
</head>
<body>
<div class="stage"><div class="frame"><div class="ph ph--a">PHOTO 1</div><div class="ph ph--b pf-iris" data-demo style="--pf-dur:1600ms">PHOTO 2</div></div></div>
<script>
/* 見本の再生制御（撮影ツール tools/shoot_preview.mjs が使う）
 *   通常: .is-on を付けて 2.6 秒見せ、0.4 秒外してループ再生
 *   ?manual を付けると自動再生しない。撮影ツールが demoReset() → demoPlay() を呼ぶ */
(function () {
  var targets = document.querySelectorAll('[data-demo]');
  window.demoReset = function () { targets.forEach(function (t) { t.classList.remove('is-on'); }); };
  window.demoPlay = function () { targets.forEach(function (t) { t.classList.add('is-on'); }); };
  if (/[?&]manual\b/.test(location.search)) return;
  // 見せる時間を長く・空白は 0.4 秒だけ（空のカードが壊れて見えないように）
  function loop() { window.demoPlay(); setTimeout(function () { window.demoReset(); setTimeout(loop, 400); }, 2600); }
  setTimeout(loop, 300);
})();
</script>
</body>
</html>
