<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>marquee 見本</title>
<link rel="stylesheet" href="preset.css">
<style>
  /* 見本用の枠（プリセットの一部ではない） */
  html, body { margin: 0; height: 100%; font-family: system-ui, "Hiragino Sans", sans-serif; color: #1a1a2e; }
  body { background: #f4f1ea; color: #24364f; }
  .stage { height: 100%; display: grid; align-content: center; gap: 6px; overflow: hidden; }
  .pf-marquee { --pf-size: 84px; --pf-speed: 14s; --pf-opacity: 0.8; }
</style>
</head>
<body>
<div class="stage">
  <div class="pf-marquee pf-marquee--outline" data-demo><div class="pf-track"><span>RECRUIT ・ WELCOME ・ </span><span>RECRUIT ・ WELCOME ・ </span></div></div>
  <div class="pf-marquee pf-marquee--outline pf-marquee--rev" data-demo style="--pf-color:#2fa87a"><div class="pf-track"><span>RECRUIT ・ WELCOME ・ </span><span>RECRUIT ・ WELCOME ・ </span></div></div>
</div>
<script>
/* 見本の再生制御（撮影ツール tools/shoot_preview.mjs が使う）
 *   通常: .is-on を付けたまま動かし続ける（常に動く動きのため）
 *   ?manual を付けると自動再生しない。撮影ツールが demoReset() → demoPlay() を呼ぶ */
(function () {
  var targets = document.querySelectorAll('[data-demo]');
  window.demoReset = function () { targets.forEach(function (t) { t.classList.remove('is-on'); }); };
  window.demoPlay = function () { targets.forEach(function (t) { t.classList.add('is-on'); }); };
  if (/[?&]manual\b/.test(location.search)) return;
  // 見せる時間を長く・空白は 0.4 秒だけ（空のカードが壊れて見えないように）
  setTimeout(window.demoPlay, 300);
})();
</script>
</body>
</html>
