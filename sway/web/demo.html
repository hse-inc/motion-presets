<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sway 見本</title>
<link rel="stylesheet" href="preset.css">
<style>
  /* 見本用の枠（プリセットの一部ではない） */
  html, body { margin: 0; height: 100%; background: #f4f1ea; font-family: system-ui, "Hiragino Sans", sans-serif; color: #1a1a2e; }
  .stage { height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 0 28px; box-sizing: border-box; overflow: hidden; }
  h2 { margin: 0; font-size: 30px; font-weight: 800; }
  p { margin: 0; font-size: 15px; line-height: 1.8; }
  .photo { height: 60px; border-radius: 8px; background: linear-gradient(120deg, #6c8cff, #8fe3c8); }
  .card { padding: 16px 18px; border-radius: 12px; background: #fff; box-shadow: 0 4px 16px rgb(26 26 46 / .12); font-weight: 700; }

  .hang { align-self: center; position: relative; margin-top: 8px; padding: 22px 36px; background: #fff; border-radius: 10px; box-shadow: 0 4px 16px rgb(26 26 46 / .15); font-size: 28px; font-weight: 900; color: #24364f; }
  .hang::before { content: ""; position: absolute; left: 50%; top: -22px; width: 3px; height: 22px; background: #24364f; transform: translateX(-50%); }
</style>
</head>
<body>
<div class="stage">
  <div class="hang pf-sway" data-demo>OPEN</div>
</div>
<script>
/* 見本の再生制御（撮影ツール tools/shoot_preview.mjs が使う）
 *   通常: .is-on を 1 回足して動かし続ける（ループの動き）
 *   ?manual を付けると自動再生しない。撮影ツールが demoReset() → demoPlay() を呼ぶ */
(function () {
  var targets = document.querySelectorAll('[data-demo]');
  window.demoReset = function () { targets.forEach(function (t) { t.classList.remove('is-on'); }); };
  window.demoPlay = function () { targets.forEach(function (t) { t.classList.add('is-on'); }); };
  if (/[?&]manual\b/.test(location.search)) return;
  setTimeout(function () { window.demoPlay(); }, 300);
})();
</script>
</body>
</html>
