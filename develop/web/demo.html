<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>develop 見本</title>
<link rel="stylesheet" href="preset.css">
<style>
  /* 見本用の枠（プリセットの一部ではない） */
  html, body { margin: 0; height: 100%; font-family: system-ui, "Hiragino Sans", sans-serif; color: #1a1a2e; }
  body { background: #f4f1ea; }
  .stage { height: 100%; display: grid; place-items: center; }
  svg { width: 300px; height: 200px; border-radius: 12px; display: block; }
</style>
</head>
<body>
<div class="stage"><svg viewBox="0 0 300 200" class="pf-develop" data-demo style="--pf-dur:1800ms"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a8fe0"/><stop offset="1" stop-color="#ffd9a0"/></linearGradient></defs><rect width="300" height="200" fill="url(#sky)"/><circle cx="220" cy="62" r="26" fill="#ff7a3d"/><path d="M0 150 Q70 90 140 140 T300 120 V200 H0z" fill="#2f9e6b"/><path d="M0 175 Q90 130 180 170 T300 160 V200 H0z" fill="#1f6f4c"/><rect x="62" y="104" width="30" height="26" fill="#e0457b"/><path d="M58 104 L77 88 L96 104z" fill="#7b2c46"/></svg></div>
<script>
/* 見本の再生制御（撮影ツール tools/shoot_preview.mjs が使う）
 *   通常: .is-on を付けて 2.8 秒見せ、0.4 秒外してループ再生
 *   ?manual を付けると自動再生しない。撮影ツールが demoReset() → demoPlay() を呼ぶ */
(function () {
  var targets = document.querySelectorAll('[data-demo]');
  window.demoReset = function () { targets.forEach(function (t) { t.classList.remove('is-on'); }); };
  window.demoPlay = function () { targets.forEach(function (t) { t.classList.add('is-on'); }); };
  if (/[?&]manual\b/.test(location.search)) return;
  // 見せる時間を長く・空白は 0.4 秒だけ（空のカードが壊れて見えないように）
  function loop() { window.demoPlay(); setTimeout(function () { window.demoReset(); setTimeout(loop, 400); }, 2800); }
  setTimeout(loop, 300);
})();
</script>
</body>
</html>
