<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>word-drop 見本</title>
<link rel="stylesheet" href="preset.css">
<style>
  /* 見本用の枠（プリセットの一部ではない） */
  html, body { margin: 0; height: 100%; background: #f4f1ea; font-family: system-ui, "Hiragino Sans", sans-serif; color: #1a1a2e; }
  .stage { height: 100%; display: grid; place-items: center; }
  h2 { margin: 0; font-size: min(44px, 8.5vw); font-weight: 900; letter-spacing: 0.02em; }
  h2 .pf-w:nth-child(2) { color: #e0457b; }
</style>
</head>
<body>
<div class="stage">
  <h2 class="pf-word-drop" data-demo><span class="pf-w" style="--c:0">車と</span><span class="pf-w" style="--c:1">バスが、</span><span class="pf-w" style="--c:2">島の足。</span></h2>
</div>
<script>
/* 見本の再生制御（撮影ツール tools/shoot_preview.mjs が使う）
 *   通常: .is-on を付けて 2.4 秒見せ、0.4 秒外してループ再生
 *   ?manual を付けると自動再生しない。撮影ツールが demoReset() → demoPlay() を呼ぶ */
(function () {
  var targets = document.querySelectorAll('[data-demo]');
  window.demoReset = function () { targets.forEach(function (t) { t.classList.remove('is-on'); }); };
  window.demoPlay = function () { targets.forEach(function (t) { t.classList.add('is-on'); }); };
  if (/[?&]manual\b/.test(location.search)) return;
  // 見せる時間を長く・空白は 0.4 秒だけ（空のカードが壊れて見えないように）
  function loop() { window.demoPlay(); setTimeout(function () { window.demoReset(); setTimeout(loop, 400); }, 2400); }
  setTimeout(loop, 300);
})();
</script>
</body>
</html>
