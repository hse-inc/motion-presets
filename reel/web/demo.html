<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>reel 見本</title>
<link rel="stylesheet" href="preset.css">
<style>
  /* 見本用の枠（プリセットの一部ではない） */
  html, body { margin: 0; height: 100%; font-family: system-ui, "Hiragino Sans", sans-serif; color: #1a1a2e; }
  body { background: #f4f1ea; }
  .stage { height: 100%; display: grid; align-content: center; gap: 14px; }
  .pf-reel { --pf-h: 6em; --pf-speed: 12s; font-size: 16px; }
  .pf-reel + .pf-reel { --pf-speed: 14s; }
  .pf-img { background: var(--a); display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 20px; }
</style>
</head>
<body>
<div class="stage">
  <div class="pf-reel" data-demo><div class="pf-track"><div class="pf-img" style="--a:#e0457b;--b:#f7a8c4">写真</div><div class="pf-img" style="--a:#2f7fd0;--b:#8ec5f5">写真</div><div class="pf-img" style="--a:#2fa87a;--b:#9fe3c4">写真</div><div class="pf-img" style="--a:#e8a52f;--b:#f6d98a">写真</div><div class="pf-img" style="--a:#7b5cff;--b:#c9b8ff">写真</div><div class="pf-img" style="--a:#e0457b;--b:#f7a8c4">写真</div><div class="pf-img" style="--a:#2f7fd0;--b:#8ec5f5">写真</div><div class="pf-img" style="--a:#2fa87a;--b:#9fe3c4">写真</div><div class="pf-img" style="--a:#e8a52f;--b:#f6d98a">写真</div><div class="pf-img" style="--a:#7b5cff;--b:#c9b8ff">写真</div></div></div>
  <div class="pf-reel pf-reel--ltr" data-demo><div class="pf-track"><div class="pf-img" style="--a:#e0457b;--b:#f7a8c4">写真</div><div class="pf-img" style="--a:#2f7fd0;--b:#8ec5f5">写真</div><div class="pf-img" style="--a:#2fa87a;--b:#9fe3c4">写真</div><div class="pf-img" style="--a:#e8a52f;--b:#f6d98a">写真</div><div class="pf-img" style="--a:#7b5cff;--b:#c9b8ff">写真</div><div class="pf-img" style="--a:#e0457b;--b:#f7a8c4">写真</div><div class="pf-img" style="--a:#2f7fd0;--b:#8ec5f5">写真</div><div class="pf-img" style="--a:#2fa87a;--b:#9fe3c4">写真</div><div class="pf-img" style="--a:#e8a52f;--b:#f6d98a">写真</div><div class="pf-img" style="--a:#7b5cff;--b:#c9b8ff">写真</div></div></div>
</div>
<script>
/* 見本の再生制御（撮影ツール tools/shoot_preview.mjs が使う）
 *   通常: .is-on を付けたまま動かし続ける（常に動く動きのため）
 *   ?manual を付けると自動再生しない。撮影ツールが demoReset() → demoPlay() を呼ぶ */
(function () {
  var targets = document.querySelectorAll('[data-demo]');
  window.demoReset = function () { targets.forEach(function (t) { t.classList.remove('is-on'); }); };
  window.demoPlay = function () { targets.forEach(function (t) { t.classList.add('is-on'); }); };
  if (/[?&]manual\b/.test(location.search)) return;
  // 見せる時間を長く・空白は 0.4 秒だけ（空のカードが壊れて見えないように）
  setTimeout(window.demoPlay, 300);
})();
</script>
</body>
</html>
